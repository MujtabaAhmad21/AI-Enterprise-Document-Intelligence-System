[project]
name = "didoc-api"
version = "0.0.0-dev"
description = "AI Enterprise Document Intelligence System — backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
    "openai>=1.54",
    "boto3>=1.35",
    "tiktoken>=0.8",
    "pgvector>=0.3.6",
    "greenlet>=3.1",
    "pypdf>=6.17.0",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "defusedxml>=0.7.1",
    "argon2-cffi>=25.1.0",
    "llama-index-core>=0.14.24",
    "email-validator>=2.2",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "testcontainers[postgres]>=4.9",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# SC-010 mandates `class X(str, Enum)` for every wire enum, not `StrEnum` — the `str` mixin is
# what makes `.value` unnecessary at serialization boundaries across the whole schema contract.
ignore = [
    "UP042",
    # SCHEMA_CONTRACT.md §9 spells `Page` with `TypeVar`/`Generic[T]` verbatim; PEP 695 type
    # parameter syntax is a rewrite of spec-literal code for no behavioral gain.
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
# Migrations embed literal DDL copied verbatim from DATABASE.md (MIG-004: hand-reviewed, not
# autogenerated); wrapping it to satisfy line-length would trade spec fidelity for nothing.
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not calibration and not grounding and not nightly and not perf'"
markers = [
    "calibration: T-5.11 chunk-size sweep — real OpenAI API calls, real cost. Excluded from the default run by addopts; invoke explicitly with `-m calibration`.",
    "grounding: T-7.8/T-7.9 grounding & refusal suites — real OpenAI embedding API calls (LLM is always the fake passthrough client), real cost. Excluded from the default run by addopts; invoke explicitly with `-m grounding`.",
    "route(operation_id): marks this test as exercising the named OpenAPI operation_id. T-10.3/TESTING_STRATEGY T-007 — tests/api/test_route_coverage.py asserts every route in app.openapi() has at least one test carrying this marker.",
    "nightly: T-10.7/TEST-313 — the real LLM provider-contract smoke test, real OpenAI API calls, real cost. Excluded from the default run by addopts; runs on .github/workflows/nightly.yml's schedule, invoke explicitly with `-m nightly`.",
    "perf: T-5.10/T-12.6 scale + latency benchmark (TEST-207/208) — real OpenAI embedding API calls, real cost, minutes of wall time. Excluded from the default run by addopts; invoke explicitly with `-m perf`.",
]

[tool.coverage.run]
source = ["app"]
# T-12.1/Phase 12 finding: without this, coverage.py silently stops tracing a coroutine the
# instant it resumes after an `await session.execute(...)` that went through SQLAlchemy's
# psycopg-async greenlet bridge — every line *after* the first DB call in a function looked
# "uncovered" even when a real, passing test exercised it (verified empirically:
# app/services/idempotency_service.py measured 40% without this setting and 94% with it,
# same test run, same code, only this line changed). Large, heavily-exercised files absorbed
# the undercount before (enough other lines stayed attributed to keep them near 100% anyway);
# a small file concentrated in async-DB logic, like idempotency_service.py, exposed it
# starkly. This was silently under-measuring coverage for the whole project, not just new code.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
# T-10.2/TESTING_STRATEGY T-003: no `fail_under` here on purpose — CI needs two DIFFERENT
# thresholds against two different `--cov` scopes and metrics (>=85% LINES on app.services;
# 100% BRANCH on the 3 critical modules), and this section applies globally regardless of
# scope. Branch instrumentation (`--cov-branch`) is likewise passed only on the second
# invocation's command line, not enabled here — turning it on globally would blend line+branch
# into one lower combined percentage for the first (lines-only) gate. Each gate's exact command
# lives in .github/workflows/ci.yml's `integration` job.
